name: Gerador de Tabela B3

on:
  schedule:
    - cron: '0 13-21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
    - name: Baixar codigo
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar pacotes
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Rodar Script
      env:
        BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
        MEUS_TICKERS: ${{ secrets.MEUS_TICKERS }}
      # ESSE COMANDO CORRIGE A LINHA DA URL NO ARQUIVO PYTHON ANTES DE EXECUTAR
      run: |
        sed -i 's|brapi.dev|brapi.dev/api/quote/|g' main.py
        python main.py

    - name: Publicar Pagina
      uses: JamesIves/github-pages-deploy-action@v4.7.5
      with:
        folder: public_html
        branch: gh-pages
