name: Gerador de Tabela B3

on:
  schedule:
    - cron: '0 13-21 * * 1-5' # Roda de hora em hora durante o pregão (Seg à Sex)
  workflow_dispatch: # Permite rodar manualmente com um clique

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Baixar codigo
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar pacotes
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Rodar Script
      env:
        BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
        MEUS_TICKERS: ${{ secrets.MEUS_TICKERS }}
      run: python main.py

    - name: Publicar Pagina
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: public_html
        branch: gh-pages
